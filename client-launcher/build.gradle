plugins {
    id 'application'
    id 'com.gradleup.shadow'
    id 'org.openjfx.javafxplugin'
}

application {
    mainClass = 'com.mcmanager.client.Main'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

javafx {
    version = '21.0.5'
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    implementation project(':shared-core')

    implementation 'io.github.mkpaz:atlantafx-base:2.1.0'
    implementation 'ch.qos.logback:logback-classic:1.5.3'

    // LWJGL + JOML for the OpenGL 3D player preview (offscreen render → PixelBuffer).
    // 3.4.x is required for JDK 24/25 compatibility (FFM backend fixes the
    // "Unsupported JNI version detected" crash seen with 3.3.4 on newer JVMs).
    implementation platform('org.lwjgl:lwjgl-bom:3.4.2')
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.joml:joml:1.10.7'

    // All native classifiers including windows-arm64 (CI ships an ARM64 MSI),
    // macos-arm64, plus x64 for every OS. LWJGL pulls the correct one at runtime.
    def lwjglNatives = ['windows', 'windows-arm64', 'linux', 'macos', 'macos-arm64']
    lwjglNatives.each { os ->
        runtimeOnly "org.lwjgl:lwjgl::natives-$os"
        runtimeOnly "org.lwjgl:lwjgl-glfw::natives-$os"
        runtimeOnly "org.lwjgl:lwjgl-opengl::natives-$os"
    }
}

shadowJar {
    archiveBaseName = 'client-launcher'
    archiveClassifier = 'all'
    // Unversioned output so CI jpackage (--main-jar client-launcher-all.jar),
    // the snap organize rule, and release scripts all match.
    archiveVersion = ''
    mergeServiceFiles()
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
